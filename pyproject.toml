[project]
name = "agent-skills-index"
version = "0.1.0"
description = "Skill Atlas - Open, machine-readable index of Agent Skills (SKILL.md)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "wanikua"}
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "pathspec>=0.12.0",
    "license-expression>=30.0.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
dedup = [
    "datasketch>=1.6.0",
    "rapidfuzz>=3.0.0",
]
scan = [
    "cisco-ai-skill-scanner",
]
mcp = [
    "mcp>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[project.scripts]
atlas = "tools.atlas.__main__:main"

[tool.setuptools]
packages = ["tools.atlas"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
