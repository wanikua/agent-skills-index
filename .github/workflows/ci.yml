name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Run ruff (linter)
        run: |
          ruff check tools/ tests/
      
      - name: Run ruff (formatter check)
        run: |
          ruff format --check tools/ tests/
      
      - name: Run pytest
        run: |
          pytest -v
      
      - name: Run atlas validate
        run: |
          atlas validate
      
      - name: Run wording lint (if available)
        run: |
          if [ -f tools/wording_lint.py ]; then
            atlas validate --wording
          else
            echo "Wording lint not available, skipping"
          fi
      
      - name: Check local links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--offline --verbose --no-progress ./*.md ./docs/**/*.md ./curated/**/*.md ./sources/**/*.md'
          fail: true
        continue-on-error: true
